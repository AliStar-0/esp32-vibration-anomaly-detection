; Machine health monitor: ESP32 + MPU6050 vibration analysis
;
; Stage 1: 1 kHz vibration sampling and an on-device frequency spectrum (FFT).
;
;   pio run -t upload
;   pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall -O2
